[versions]
agp = "9.2.1"
kotlin = "2.4.10" # ML Kit genai (firebase-ai-ondevice) ships Kotlin 2.4 metadata
ksp = "2.3.14"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.02.01"
navigationCompose = "2.8.5"
kotlinxSerializationJson = "1.8.1"
coroutines = "1.10.2"
koinBom = "4.0.0"
room = "2.8.1"
paging = "3.3.6"
workmanager = "2.10.0"
datastore = "1.1.7"
coil = "2.7.0"
googleServices = "4.4.2"
# Firebase AI Logic. firebase-ai-ondevice is not in the BoM, so both are pinned together.
firebaseAi = "18.2.0"
firebaseAiOnDevice = "16.0.0-beta08"
firebaseAppCheck = "20.1.0"
firebaseConfig = "24.0.1"
junit5 = "5.11.4"
assertk = "0.28.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
